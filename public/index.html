<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c241e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Secret Santa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="stage">
      <header class="mast">
        <p class="eyebrow" id="statusLine">Loading the hat…</p>
        <h1>Names in a hat</h1>
        <p class="lede">
          Add your name and a 4-digit PIN. Everyone joins first. Matching happens later, then you pull your slip.
        </p>
      </header>

      <div class="hat" aria-hidden="true">
        <div class="hat-brim"></div>
        <div class="hat-crown">
          <span class="slip slip-a">?</span>
          <span class="slip slip-b">?</span>
        </div>
      </div>

      <div id="result" class="result" hidden></div>
      <p id="error" class="error" hidden></p>

      <div class="tabs" role="tablist" aria-label="Choose an action">
        <button type="button" class="tab is-active" data-tab="join" aria-selected="true">Join</button>
        <button type="button" class="tab" data-tab="lookup" aria-selected="false">Match</button>
        <button type="button" class="tab" data-tab="host" aria-selected="false">Host</button>
      </div>

      <div class="panels">
        <section class="panel is-active" data-panel="join" aria-labelledby="joinHeading">
          <h2 id="joinHeading">Join the draw</h2>
          <form id="joinForm">
            <label>
              Your name
              <input
                name="name"
                type="text"
                maxlength="80"
                autocomplete="name"
                autocapitalize="words"
                enterkeyhint="next"
                required
              />
            </label>
            <label>
              4-digit PIN
              <input
                name="pin"
                type="password"
                inputmode="numeric"
                pattern="\d{4}"
                maxlength="4"
                autocomplete="one-time-code"
                enterkeyhint="done"
                required
              />
            </label>
            <button type="submit">Put my name in</button>
          </form>
        </section>

        <section class="panel" data-panel="lookup" aria-labelledby="lookupHeading">
          <h2 id="lookupHeading">See my match</h2>
          <form id="lookupForm">
            <label>
              Your name
              <input
                name="name"
                type="text"
                maxlength="80"
                autocomplete="name"
                autocapitalize="words"
                enterkeyhint="next"
                required
              />
            </label>
            <label>
              4-digit PIN
              <input
                name="pin"
                type="password"
                inputmode="numeric"
                pattern="\d{4}"
                maxlength="4"
                autocomplete="one-time-code"
                enterkeyhint="done"
                required
              />
            </label>
            <button type="submit">Pull my slip</button>
          </form>
        </section>

        <section class="panel host-panel" data-panel="host" aria-labelledby="hostHeading">
          <h2 id="hostHeading">Host</h2>
          <p class="host-copy">When every name is in, draw the matches. People then look themselves up.</p>
          <form id="hostForm">
            <label>
              Host secret
              <input name="secret" type="password" autocomplete="off" required />
            </label>
            <div class="host-actions">
              <button type="submit" name="action" value="draw">Draw names</button>
              <button type="submit" name="action" value="reset" class="secondary">Reset draw</button>
            </div>
          </form>
        </section>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
