<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c241e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Secret Santa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="stage">
      <header class="mast">
        <p class="eyebrow" id="statusLine">Loading the hat…</p>
        <h1>Names in a hat</h1>
        <p class="lede">Add your Full Name to the draw ). Matching happens later.</p>
      </header>

      <div class="hat" aria-hidden="true">
        <div class="hat-brim"></div>
        <div class="hat-crown">
          <span class="slip slip-a">?</span>
          <span class="slip slip-b">?</span>
        </div>
      </div>

      <div id="result" class="result" hidden></div>
      <p id="error" class="error" hidden></p>

      <section class="panel is-active" aria-labelledby="joinHeading">
        <h2 id="joinHeading">Join the draw</h2>
        <form id="joinForm">
          <label>
            Your name
            <input
              name="name"
              type="text"
              maxlength="80"
              autocomplete="name"
              autocapitalize="words"
              enterkeyhint="done"
              required
            />
          </label>
          <button type="submit">Put my name in</button>
        </form>
      </section>

      <section class="roster" aria-live="polite">
        <h2>In the hat</h2>
        <ol id="nameList" class="name-list"></ol>
        <p id="emptyRoster" class="empty-roster">No names yet. Be the first.</p>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
